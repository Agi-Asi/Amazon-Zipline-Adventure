<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Canopy Zipline — Amazon Run</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#8fd3a8;touch-action:none;
    font-family:ui-rounded,'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#0d2a17;user-select:none}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between}
  .row{display:flex;align-items:flex-start;gap:8px;width:100%}
  .row.top{justify-content:space-between}
  .row.bottom{align-items:center;justify-content:space-between;gap:10px}
  .pill{background:rgba(255,255,255,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:2px solid rgba(255,255,255,.85);border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:6px;
    box-shadow:0 6px 18px rgba(12,60,30,.22);font-weight:800;font-size:15px;letter-spacing:.3px;color:#12331d}
  .pill .dim{opacity:.5;font-weight:700}
  .pill .ico{font-size:17px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.15))}
  #ringPill b{font-size:19px;color:#1c8a3c}
  .timer{flex-direction:column;align-items:stretch;border-radius:18px;padding:6px 12px 8px;min-width:130px}
  .timer .toprow{display:flex;align-items:baseline;gap:4px;justify-content:center}
  .timer b{font-size:20px;color:#136b8a}
  .bar{height:7px;border-radius:6px;background:rgba(10,50,30,.16);overflow:hidden;margin-top:4px;width:100%}
  .bar i{display:block;height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,#ffe14d,#4ce07a,#28c3f0);transition:width .1s linear}
  .low .bar i{background:linear-gradient(90deg,#ff6b4a,#ff9d3c)}
  .low b{color:#d63a19!important}
  .low{animation:pulse .7s infinite ease-in-out}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .btn{pointer-events:auto;cursor:pointer;font:inherit;font-weight:800;color:#12331d}
  .btn:active{transform:scale(.94)}
  .track{position:relative;flex:1;height:12px;border-radius:8px;background:rgba(255,255,255,.55);
    border:2px solid rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(12,60,30,.18);overflow:visible}
  .track > i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#5ce08a,#f7e05a);width:0%}
  .mark{position:absolute;top:50%;width:9px;height:9px;margin-left:-4.5px;margin-top:-4.5px;border-radius:50%;
    background:#fff;border:2px solid #2fae55;box-shadow:0 0 6px rgba(60,220,120,.9)}
  .mark.got{background:#ffe14d;border-color:#f0a51e}
  .mark.miss{background:#c8c8c8;border-color:#8e8e8e;box-shadow:none}
  .btns{display:flex;gap:8px}
  .tbtn{pointer-events:auto;cursor:pointer;border:2px solid rgba(255,255,255,.85);border-radius:14px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(8px);padding:10px 14px;font:inherit;font-weight:900;font-size:12px;
    letter-spacing:1px;color:#12331d;box-shadow:0 6px 16px rgba(12,60,30,.2)}
  .tbtn:active{transform:scale(.93);background:#ffe98a}
  #hint{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:13px;font-weight:700;
    color:#0e3a20;text-shadow:0 1px 0 rgba(255,255,255,.7);opacity:1;transition:opacity 1s ease;padding:0 20px}
  #hint b{background:rgba(255,255,255,.75);border-radius:6px;padding:1px 6px;margin:0 1px}
  #end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .45s ease}
  #end.show{opacity:1;pointer-events:auto}
  .card{background:linear-gradient(160deg,rgba(255,255,255,.94),rgba(224,255,231,.92));border:3px solid #fff;
    border-radius:26px;padding:26px 30px;text-align:center;box-shadow:0 22px 60px rgba(8,50,25,.35);max-width:90vw;
    transform:translateY(14px) scale(.96);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
  #end.show .card{transform:none}
  .card h1{margin:0 0 4px;font-size:30px;color:#137a3a;letter-spacing:.5px}
  .card p{margin:2px 0 14px;font-size:15px;font-weight:700;color:#2c5a3d}
  .stats{display:flex;gap:16px;justify-content:center;margin-bottom:16px}
  .stat{background:rgba(255,255,255,.8);border-radius:16px;padding:8px 16px;min-width:84px}
  .stat span{display:block;font-size:11px;font-weight:800;letter-spacing:1px;opacity:.6}
  .stat b{font-size:24px;color:#0f7a55}
  .big{cursor:pointer;border:none;border-radius:999px;padding:13px 30px;font:inherit;font-weight:900;font-size:17px;
    color:#053a1c;background:linear-gradient(180deg,#8ef07c,#3fd06a);box-shadow:0 8px 0 #23924a,0 14px 24px rgba(10,60,30,.3)}
  .big:active{transform:translateY(5px);box-shadow:0 3px 0 #23924a}
  @media (max-width:520px){ .pill{font-size:13px;padding:6px 11px} #ringPill b{font-size:17px} .timer b{font-size:17px}
    #hint{bottom:70px;font-size:11px} .card h1{font-size:24px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row top">
    <div class="pill" id="ringPill"><span class="ico">🍃</span><b id="ringCount">0</b><span class="dim">/</span><span id="ringTotal">14</span></div>
    <div class="pill timer" id="timerPill">
      <div class="toprow"><b id="timeText">60.0</b><span class="dim">s</span></div>
      <div class="bar"><i id="timeBar"></i></div>
    </div>
    <button class="pill btn" id="resetBtn">⟲ Reset</button>
  </div>
  <div class="row bottom">
    <div class="pill"><b id="spdText">0</b><span class="dim">km/h</span></div>
    <div class="track"><i id="prog"></i><div id="marks"></div></div>
    <div class="btns">
      <button class="tbtn" id="brakeBtn">BRAKE</button>
      <button class="tbtn" id="tuckBtn">TUCK</button>
    </div>
  </div>
  <div id="hint">Lean with <b>A</b><b>D</b> or <b>←</b><b>→</b> — or drag the screen. Fly through the glowing leaf rings!</div>
</div>
<div id="end"><div class="card">
  <h1 id="endTitle">You made it!</h1>
  <p id="endSub">The canopy salutes you.</p>
  <div class="stats">
    <div class="stat"><span>RINGS</span><b id="endRings">0/14</b></div>
    <div class="stat"><span>TIME LEFT</span><b id="endTime">0s</b></div>
    <div class="stat"><span>SCORE</span><b id="endScore">0</b></div>
  </div>
  <button class="big" id="againBtn">Zip Again ⟲</button>
</div></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============ helpers ============ */
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* ============ renderer / scene ============ */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.16;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xa9e2c4,0.0017);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.5,3000);
const uTime={value:0};

/* lights */
scene.add(new THREE.HemisphereLight(0xd8f6ff,0x2f6b32,1.05));
const sun=new THREE.DirectionalLight(0xfff2c0,1.55);
sun.position.set(180,320,120); scene.add(sun);
const fill=new THREE.DirectionalLight(0x9cffcd,.35); fill.position.set(-160,90,-200); scene.add(fill);

/* ============ procedural textures ============ */
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,rw,rh){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  if(rw){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rw,rh);} return t;}

const leafTex=(()=>{const c=cvs(64,64),x=c.getContext('2d');
  x.translate(32,32);x.fillStyle='#63d84e';x.beginPath();
  x.moveTo(0,-28);x.bezierCurveTo(22,-16,22,16,0,28);x.bezierCurveTo(-22,16,-22,-16,0,-28);x.fill();
  x.strokeStyle='rgba(30,110,40,.65)';x.lineWidth=2;x.beginPath();x.moveTo(0,-26);x.lineTo(0,26);x.stroke();
  return tex(c);})();
const glowTex=(()=>{const c=cvs(128,128),x=c.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(210,255,190,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);return tex(c);})();
const mistTex=(()=>{const c=cvs(256,256),x=c.getContext('2d');const g=x.createRadialGradient(128,128,10,128,128,128);
  g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(.5,'rgba(235,255,245,.35)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,256,256);return tex(c);})();
const beamTex=(()=>{const c=cvs(64,256),x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'rgba(255,250,200,.85)');g.addColorStop(1,'rgba(255,250,190,0)');x.fillStyle=g;x.fillRect(0,0,64,256);
  const h=x.createLinearGradient(0,0,64,0);h.addColorStop(0,'rgba(0,0,0,1)');h.addColorStop(.5,'rgba(0,0,0,0)');h.addColorStop(1,'rgba(0,0,0,1)');
  x.globalCompositeOperation='destination-out';x.fillStyle=h;x.fillRect(0,0,64,256);return tex(c);})();
const waterTex=(()=>{const c=cvs(64,256),x=c.getContext('2d');x.fillStyle='#e8fbff';x.fillRect(0,0,64,256);
  for(let i=0;i<70;i++){x.fillStyle=`rgba(${180+Math.random()*60|0},${230+Math.random()*25|0},255,${.25+Math.random()*.5})`;
    x.fillRect(Math.random()*64,Math.random()*256,rnd(1,5),rnd(20,90));}
  return tex(c,1,1);})();
waterTex.wrapS=waterTex.wrapT=THREE.RepeatWrapping;
const bannerTex=(()=>{const c=cvs(512,128),x=c.getContext('2d');x.fillStyle='#ffd94a';x.fillRect(0,0,512,128);
  x.fillStyle='#1c7a3e';x.font='bold 76px sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText('★ FINISH ★',256,68);return tex(c);})();

/* ============ path ============ */
const pathPts=[];
const SEGN=14;
for(let i=0;i<=SEGN;i++){
  const f=i/SEGN;
  pathPts.push(new THREE.Vector3(
    Math.sin(f*Math.PI*2.25)*58+Math.sin(f*7.3)*9,
    96-f*74+Math.sin(f*Math.PI*3)*4.5,
    -f*1150));
}
const curve=new THREE.CatmullRomCurve3(pathPts,false,'catmullrom',0.4);
const LEN=curve.getLength();
const ROPE=6.0, MAXA=0.92;

const dummy=new THREE.Object3D();
function frameAt(t,angle){
  const p=curve.getPointAt(clamp(t,0,1)), tan=curve.getTangentAt(clamp(t,0,1));
  dummy.position.copy(p); dummy.up.set(0,1,0);
  dummy.lookAt(p.x+tan.x,p.y+tan.y,p.z+tan.z);
  dummy.rotateZ(angle); dummy.updateMatrixWorld(true);
  return dummy;
}

/* ============ sky ============ */
const skyGeo=new THREE.SphereGeometry(1600,32,20);
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{},
  vertexShader:`varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vP;
   void main(){ float h=normalize(vP).y;
     vec3 top=vec3(0.22,0.62,0.92), mid=vec3(0.68,0.93,0.95), low=vec3(0.86,0.98,0.80);
     vec3 c=mix(low,mid,smoothstep(-0.1,0.28,h)); c=mix(c,top,smoothstep(0.22,0.85,h));
     vec3 d=normalize(vP); float s=pow(max(dot(d,normalize(vec3(0.45,0.72,0.35))),0.),40.);
     c+=vec3(1.0,0.95,0.7)*s*0.9;
     gl_FragColor=vec4(c,1.);}`});
scene.add(new THREE.Mesh(skyGeo,skyMat));
const sunSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xfff4b0,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
sunSprite.scale.set(700,700,1); sunSprite.position.set(600,950,450); scene.add(sunSprite);

/* ============ terrain ============ */
function terrainH(x,z){return Math.sin(x*0.011)*6+Math.cos(z*0.008)*7+Math.sin((x+z)*0.004)*8-6;}
{
  const g=new THREE.PlaneGeometry(3000,3000,80,80); g.rotateX(-Math.PI/2);
  const p=g.attributes.position, col=[];
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i); const y=terrainH(x,z)+rnd(-1.5,1.5);
    p.setY(i,y);
    const c=new THREE.Color().setHSL(0.28+Math.random()*0.06,0.55,0.20+Math.random()*0.12);
    col.push(c.r,c.g,c.b);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  m.position.z=-500; scene.add(m);
  // river ribbon
  const rg=new THREE.PlaneGeometry(60,3000); rg.rotateX(-Math.PI/2);
  const rm=new THREE.MeshStandardMaterial({color:0x2f9fc6,roughness:.15,metalness:.1,transparent:true,opacity:.85});
  const river=new THREE.Mesh(rg,rm); river.position.set(120,-4,-500); river.rotation.y=0.06; scene.add(river);
}

/* ============ cable + guide sparks ============ */
{
  const g=new THREE.TubeGeometry(curve,420,0.22,6,false);
  scene.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x35302c,roughness:.6,metalness:.5})));
}
const sparkCount=260, sparkGeo=new THREE.BufferGeometry();
{
  const pos=new Float32Array(sparkCount*3);
  sparkGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
}
const sparks=new THREE.Points(sparkGeo,new THREE.PointsMaterial({size:1.5,map:glowTex,color:0xdcffa0,transparent:true,
  opacity:.75,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
scene.add(sparks);
function updateSparks(){
  const arr=sparkGeo.attributes.position.array;
  for(let i=0;i<sparkCount;i++){
    let t=(i/sparkCount+uTime.value*0.012)%1;
    const p=curve.getPointAt(t);
    arr[i*3]=p.x;arr[i*3+1]=p.y-0.5;arr[i*3+2]=p.z;
  }
  sparkGeo.attributes.position.needsUpdate=true;
}

/* ============ forest: trees ============ */
const swayInject=(mat,amp)=>{
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=uTime;
    sh.vertexShader='uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec3 ip=vec3(instanceMatrix[3][0],instanceMatrix[3][1],instanceMatrix[3][2]);
      #else
        vec3 ip=vec3(0.0);
      #endif
      float sw=sin(uTime*1.05+ip.x*0.07+ip.z*0.05);
      float sw2=cos(uTime*0.83+ip.z*0.06);
      transformed.x+=sw*${amp.toFixed(2)};
      transformed.z+=sw2*${(amp*0.75).toFixed(2)};`);
  };
};

const trunkGeo=new THREE.CylinderGeometry(0.42,1.0,1,7,1); trunkGeo.translate(0,0.5,0);
const canopyGeo=new THREE.IcosahedronGeometry(1,1);
const trunkMat=new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true});
const canopyMat=new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true});
swayInject(canopyMat,0.55);

const treeSpots=[];
for(let i=0;i<=64;i++){
  const u=i/64, p=curve.getPointAt(u), tan=curve.getTangentAt(u);
  const right=new THREE.Vector3().crossVectors(tan,new THREE.Vector3(0,1,0)).normalize();
  for(let s=-1;s<=1;s+=2){
    for(let k=0;k<3;k++){
      const off=rnd(21,44)+k*rnd(38,70);
      const q=p.clone().addScaledVector(right,s*off);
      q.x+=rnd(-16,16); q.z+=rnd(-18,18);
      treeSpots.push({x:q.x,z:q.z,top:p.y+rnd(-16,22),far:k});
    }
  }
}
for(let i=0;i<130;i++){ // background giants
  const a=rnd(0,Math.PI*2), r=rnd(260,900);
  const x=Math.sin(a)*r, z=-rnd(0,1200)+Math.cos(a)*r*0.4;
  treeSpots.push({x,z,top:rnd(60,140),far:3});
}
const canopyCount=treeSpots.length*4;
const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,treeSpots.length);
const canopies=new THREE.InstancedMesh(canopyGeo,canopyMat,canopyCount);
trunks.frustumCulled=false; canopies.frustumCulled=false;
const flowerSpots=[];
{
  const d=new THREE.Object3D(); const col=new THREE.Color(); let ci=0;
  treeSpots.forEach((t,i)=>{
    const base=terrainH(t.x,t.z), h=Math.max(24,t.top-base);
    d.position.set(t.x,base,t.z); d.rotation.set(0,rnd(0,6.28),0);
    d.scale.set(1+h*0.028,h,1+h*0.028); d.updateMatrix();
    trunks.setMatrixAt(i,d.matrix);
    col.setHSL(0.08,0.28,rnd(0.20,0.34)); trunks.setColorAt(i,col);
    const blobs=t.far>=3?3:4;
    for(let b=0;b<blobs;b++){
      const rr=rnd(7,15)*(t.far>=3?1.5:1);
      d.position.set(t.x+rnd(-9,9),base+h+rnd(-7,5),t.z+rnd(-9,9));
      d.rotation.set(rnd(0,6),rnd(0,6),rnd(0,6));
      d.scale.set(rr,rr*rnd(.6,.85),rr); d.updateMatrix();
      if(ci<canopyCount){ canopies.setMatrixAt(ci,d.matrix);
        col.setHSL(rnd(0.24,0.34),rnd(0.45,0.8),rnd(0.24,0.46)); canopies.setColorAt(ci,col); ci++; }
    }
    if(t.far<2&&Math.random()<0.5) flowerSpots.push(new THREE.Vector3(t.x+rnd(-10,10),base+h+rnd(-4,4),t.z+rnd(-10,10)));
    if(Math.random()<0.35) flowerSpots.push(new THREE.Vector3(t.x+rnd(-14,14),base+rnd(.5,3),t.z+rnd(-14,14)));
  });
  for(;ci<canopyCount;ci++){ d.position.set(0,-999,0); d.scale.set(.01,.01,.01); d.updateMatrix(); canopies.setMatrixAt(ci,d.matrix); }
  trunks.instanceMatrix.needsUpdate=true; canopies.instanceMatrix.needsUpdate=true;
}
scene.add(trunks,canopies);

/* ============ flowers ============ */
{
  const fg=new THREE.IcosahedronGeometry(0.9,0); fg.scale(1,0.45,1);
  const fm=new THREE.MeshLambertMaterial({flatShading:true});
  const N=Math.min(flowerSpots.length,700);
  const fl=new THREE.InstancedMesh(fg,fm,N); fl.frustumCulled=false;
  const d=new THREE.Object3D(), c=new THREE.Color();
  const hues=[0.95,0.02,0.08,0.13,0.86,0.75,0.55];
  for(let i=0;i<N;i++){
    const s=flowerSpots[i];
    d.position.copy(s); d.rotation.set(rnd(-.4,.4),rnd(0,6),rnd(-.4,.4));
    const k=rnd(1,2.4); d.scale.set(k,k,k); d.updateMatrix(); fl.setMatrixAt(i,d.matrix);
    c.setHSL(hues[i%hues.length],0.85,0.62); fl.setColorAt(i,c);
  }
  scene.add(fl);
}

/* ============ vines ============ */
{
  const geos=[];
  for(let i=0;i<110;i++){
    const u=Math.random(), p=curve.getPointAt(u), tan=curve.getTangentAt(u);
    const right=new THREE.Vector3().crossVectors(tan,new THREE.Vector3(0,1,0)).normalize();
    const side=Math.random()<.5?-1:1;
    const base=p.clone().addScaledVector(right,side*rnd(9,55)).add(new THREE.Vector3(rnd(-14,14),rnd(2,22),rnd(-16,16)));
    const len=rnd(16,48);
    const pts=[];
    for(let k=0;k<=4;k++){const f=k/4;
      pts.push(new THREE.Vector3(base.x+Math.sin(f*3)*rnd(0,3),base.y-len*f,base.z+Math.cos(f*2.4)*rnd(0,3)));}
    const c=new THREE.CatmullRomCurve3(pts);
    const g=new THREE.TubeGeometry(c,10,rnd(.12,.26),4,false);
    const cnt=g.attributes.position.count, sway=new Float32Array(cnt);
    for(let v=0;v<cnt;v++){ sway[v]=Math.floor(v/5)/10; }

/* ============ audio ============ */
let AC=null,windGain=null,windFilter=null,master=null;
function initAudio(){
  if(AC)return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){return;}
  master=AC.createGain(); master.gain.value=.6; master.connect(AC.destination);
  const len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  windFilter=AC.createBiquadFilter(); windFilter.type='lowpass'; windFilter.frequency.value=500;
  windGain=AC.createGain(); windGain.gain.value=0.0;
  src.connect(windFilter); windFilter.connect(windGain); windGain.connect(master); src.start();
  scheduleChirp();
}
function resumeAudio(){ initAudio(); if(AC&&AC.state==='suspended') AC.resume(); }
function beep(freq,dur,type='sine',vol=.25,slide=0){
  if(!AC)return; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,AC.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(60,freq+slide),AC.currentTime+dur);
  g.gain.setValueAtTime(0,AC.currentTime); g.gain.linearRampToValueAtTime(vol,AC.currentTime+.012);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime+dur+.02);
}
function chime(i){ const base=520*Math.pow(1.06,i); beep(base,.35,'triangle',.22); beep(base*1.5,.28,'sine',.14); }
function scheduleChirp(){
  if(!AC)return;
  setTimeout(()=>{ if(AC&&AC.state==='running'){ const f=rnd(1700,3100); beep(f,.09,'sine',.05,rnd(300,900));
    setTimeout(()=>beep(f*1.1,.08,'sine',.04,-400),120); } scheduleChirp(); }, rnd(1800,5200));
}

/* ============ update ============ */
function updatePlayer(dt){
  // lean input
  let inp=0;
  if(keys.KeyA||keys.ArrowLeft) inp-=1;
  if(keys.KeyD||keys.ArrowRight) inp+=1;
  if(inp===0&&ptrOn) inp=clamp((ptrX/innerWidth-0.5)*2.6,-1,1);
  const target=inp*MAXA;
  angV+=(target-ang)*17*dt; angV*=Math.pow(0.05,dt); ang+=angV*dt;
  ang=clamp(ang,-MAXA*1.15,MAXA*1.15);
  // speed
  const braking=keys.KeyS||keys.ArrowDown||brakeBtnOn;
  const tuck=keys.Space||keys.KeyW||keys.ArrowUp||tuckBtnOn;
  const tan=curve.getTangentAt(clamp(u,0,1));
  let acc=(-tan.y)*40+5-0.012*speed*speed;
  if(braking) acc-=30;
  if(tuck) acc+=11;
  speed=clamp(speed+acc*dt, braking?7:11, 64);
  prevU=u;
  u+=speed*dt/LEN;
  // transform
  const fr=frameAt(clamp(u,0,1),ang);
  pivot.position.copy(fr.position); pivot.quaternion.copy(fr.quaternion);
  pivot.updateMatrixWorld(true);
  prevPlayerPos.copy(playerPos);
  rig.getWorldPosition(playerPos);
  // dangle animation
  const legs=rig.userData.legs; legs.rotation.x=Math.sin(uTime.value*4)*0.16-speed*0.004;
  rig.userData.scarf.rotation.x=-0.5-Math.sin(uTime.value*7)*0.25;
  rig.rotation.z=-angV*0.12;
}
function checkRings(){
  for(const r of RINGS){
    if(r.done) continue;
    if(r.t>prevU&&r.t<=u){
      const f=(r.t-prevU)/Math.max(1e-6,u-prevU);
      tmpV.lerpVectors(prevPlayerPos,playerPos,f);
      const d=tmpV.distanceTo(r.pos);
      r.done=true;
      const idx=RINGS.indexOf(r);
      if(d<3.05){
        r.state=1; got++; timeLeft+=2.6; speed=Math.min(64,speed+3.5);
        chime(got); burst(r.pos,0xbdff7a);
        markEls[idx].className='mark got';
        r.core.material.color.set(0xffe14d); r.core.material.emissive.set(0xffa726); r.core.material.emissiveIntensity=1.8;
        r.pop=1;
      }else{
        r.state=2; beep(140,.22,'sine',.09,-60);
        markEls[idx].className='mark miss';
        r.core.material.color.set(0x8b9c88); r.core.material.emissive.set(0x3a4a38); r.core.material.emissiveIntensity=.25;
        r.halo.material.opacity=.05;
      }
    }
  }
}
function syncCamera(snap){
  const tan=curve.getTangentAt(clamp(u,0,1));
  const right=tmpV2.crossVectors(tan,new THREE.Vector3(0,1,0)).normalize();
  const dist=10.5+speed*0.09;
  const want=tmpV.copy(playerPos).addScaledVector(tan,-dist).addScaledVector(right,Math.sin(ang)*2.2);
  want.y+=3.4;
  const k=snap?1:1-Math.pow(0.0009,Math.min(0.05,lastDt));
  camPos.lerp(want,k); if(snap)camPos.copy(want);
  const look=new THREE.Vector3().copy(playerPos).addScaledVector(tan,17); look.y+=1.2;
  camLook.lerp(look,snap?1:k*1.15>1?1:k*1.15);
  camera.position.copy(camPos);
  camera.up.set(0,1,0);
  camera.lookAt(camLook);
  camera.rotateZ(-ang*0.13-angV*0.02);
  const fov=62+clamp(speed*0.32,0,15);
  camera.fov=lerp(camera.fov,fov,snap?1:0.06); camera.updateProjectionMatrix();
}
function updateWorld(dt){
  updateSparks();
  // rings idle
  for(const r of RINGS){
    r.leaves.rotation.z+=dt*(r.state===1?1.8:0.42);
    if(r.state===0){ const s=1+Math.sin(uTime.value*3+r.t*12)*0.035; r.holder.scale.setScalar(s);
      r.halo.material.opacity=.22+Math.sin(uTime.value*3+r.t*9)*.1; }
    if(r.pop>0){ r.pop=Math.max(0,r.pop-dt*1.8);
      const s=1+r.pop*0.9; r.holder.scale.setScalar(s); r.halo.material.opacity=r.pop*0.8;
      if(r.pop<=0) r.holder.visible=false; }
    if(r.state===2){ r.holder.scale.multiplyScalar(1-dt*0.35); }
  }
  // leaves drift
  const arr=leafGeo.attributes.position.array;
  for(let i=0;i<LEAF_N;i++){
    const v=leafVel[i];
    arr[i*3]+=(v.x+Math.sin(uTime.value*1.5+i)*1.6)*dt;
    arr[i*3+1]+=v.y*dt;
    arr[i*3+2]+=v.z*dt;
    const dx=arr[i*3]-playerPos.x, dy=arr[i*3+1]-playerPos.y, dz=arr[i*3+2]-playerPos.z;
    if(dy<-55||Math.abs(dx)>95||Math.abs(dz)>110){
      arr[i*3]=playerPos.x+rnd(-80,80); arr[i*3+1]=playerPos.y+rnd(25,60); arr[i*3+2]=playerPos.z+rnd(-90,60);
    }
  }
  leafGeo.attributes.position.needsUpdate=true;
  // mist drift
  mists.forEach(o=>{o.m.position.x+=o.sp*dt*3;o.m.rotation.z+=dt*0.02;});
  // beams billboard slightly
  beams.forEach((b,i)=>{ b.rotation.y=Math.atan2(camera.position.x-b.position.x,camera.position.z-b.position.z)*0.6; });
  // birds
  birds.forEach(b=>{
    b.ph+=dt*b.sp;
    b.g.position.set(b.c.x+Math.cos(b.ph)*b.rad,b.c.y+Math.sin(b.ph*1.7)*6,b.c.z+Math.sin(b.ph)*b.rad);
    b.g.rotation.y=-b.ph+Math.PI/2;
    const f=Math.sin(uTime.value*b.fl+b.ph*3)*0.8;
    b.l.rotation.z=f; b.r.rotation.z=-f;
  });
  flutters.forEach(f=>{
    f.ph+=dt*2.2;
    f.g.position.set(f.c.x+Math.cos(f.ph)*f.r,f.c.y+Math.sin(f.ph*2.3)*3,f.c.z+Math.sin(f.ph*.8)*f.r);
    f.g.rotation.y=uTime.value*1.5+f.ph;
    const w=Math.sin(uTime.value*16+f.ph)*0.9;
    f.a.rotation.y=w; f.b.rotation.y=-w;
  });
  falls.forEach(f=>{ f.tex.offset.y-=dt*0.8; });
  // bursts
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i]; b.life+=dt;
    if(b.pts){
      const a=b.pts.geometry.attributes.position.array;
      for(let k=0;k<b.vel.length;k++){ const v=b.vel[k];
        a[k*3]+=v.x*dt; a[k*3+1]+=v.y*dt; a[k*3+2]+=v.z*dt; v.y-=17*dt; v.multiplyScalar(1-dt*1.2); }
      b.pts.geometry.attributes.position.needsUpdate=true;
      b.pts.material.opacity=Math.max(0,1-b.life/1.0);
      if(b.life>1.0){scene.remove(b.pts);b.pts.geometry.dispose();b.pts.material.dispose();bursts.splice(i,1);}
    } else {
      const s=1+b.life*5; b.ring.scale.setScalar(s); b.ring.material.opacity=Math.max(0,.9-b.life*1.6);
      if(b.life>.6){scene.remove(b.ring);b.ring.geometry.dispose();b.ring.material.dispose();bursts.splice(i,1);}
    }
  }
  if(windGain){
    const tv=clamp(speed/64,0,1);
    windGain.gain.value=lerp(windGain.gain.value,0.015+tv*0.075,0.1);
    windFilter.frequency.value=lerp(windFilter.frequency.value,300+tv*1400,0.1);
  }
}
function updateHUD(){
  el.ring.textContent=got;
  el.time.textContent=Math.max(0,timeLeft).toFixed(1);
  el.bar.style.width=clamp(timeLeft/TIME*100,0,100)+'%';
  el.pill.classList.toggle('low',timeLeft<10);
  el.spd.textContent=Math.round(speed*3.6);
  el.prog.style.width=clamp(u*100,0,100)+'%';
}

/* ============ loop ============ */
const clock=new THREE.Clock();
let lastDt=0.016;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(0.05,clock.getDelta()); lastDt=dt;
  uTime.value+=dt;
  if(state==='play'){
    updatePlayer(dt);
    checkRings();
    timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; endGame(false); }
    if(u>=1){ u=1; endGame(true); }
    syncCamera(camSnap); camSnap=false;
    updateHUD();
  } else {
    endTimer+=dt;
    const focus=state==='win'?new THREE.Vector3(END.x,END.y-4,END.z+2):playerPos;
    const a=endTimer*0.35;
    const want=tmpV.set(focus.x+Math.cos(a)*24,focus.y+9,focus.z+Math.sin(a)*24);
    camPos.lerp(want,1-Math.pow(0.02,dt));
    camera.position.copy(camPos); camera.up.set(0,1,0); camera.lookAt(focus);
    camera.fov=lerp(camera.fov,58,0.05); camera.updateProjectionMatrix();
    if(state==='win'){ rig.rotation.z=0; }
  }
  updateWorld(dt);
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
});
addEventListener('pointerdown',resumeAudio,{once:false});

reset();
tick();
</script>
