<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#194e38">
<title>Canopy Rush</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap');
:root{--forest:#173f30;--lime:#d8f979;--cream:#f8fce9;--glass:rgba(248,252,233,.91)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:'DM Sans',sans-serif;color:var(--forest);background:#a4ded1;user-select:none;-webkit-user-select:none}
button{font:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #e5ff80;outline-offset:4px}
#world{position:fixed;inset:0;touch-action:none}
#world canvas{display:block;width:100%;height:100%}
.vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(17,65,42,.07),transparent 20%,transparent 67%,rgba(13,58,37,.37))}
.hud{position:fixed;inset:0;pointer-events:none}
.topbar{position:absolute;top:24px;left:28px;right:28px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand{display:flex;gap:12px;align-items:center;padding:12px 20px 12px 12px;border-radius:19px;background:var(--glass);box-shadow:0 5px 25px #194d3020;border:1px solid #ffffff8c;backdrop-filter:blur(14px)}
.brand-icon{height:43px;width:43px;display:grid;place-items:center;background:#daf581;border-radius:13px}
.brand-icon svg{width:28px;height:28px}
.brand h1{font-family:Outfit,sans-serif;font-size:25px;line-height:1;margin:0;font-weight:700;letter-spacing:-.8px}
.eyebrow{font-size:9px;letter-spacing:2.1px;font-weight:700;margin-bottom:5px}
.metrics{position:absolute;left:50%;transform:translateX(-50%);display:flex;background:var(--glass);border:1px solid #ffffff9c;border-radius:19px;box-shadow:0 5px 25px #194d3020;backdrop-filter:blur(14px);padding:12px 6px}
.metric{display:flex;align-items:center;gap:11px;padding:0 23px;min-width:157px}
.metric+.metric{border-left:1px solid #24543524}
.metric-icon{width:32px;height:32px;display:grid;place-items:center;color:#4b7153}
.metric-icon svg{width:28px;height:28px}
.metric-value{font-family:Outfit,sans-serif;font-size:29px;font-weight:600;letter-spacing:-.7px;font-variant-numeric:tabular-nums;line-height:1.03}
.metric-value .total{font-size:19px;font-weight:400;color:#6d8269;margin-left:3px}
.metric-label{font-size:9px;letter-spacing:1.5px;font-weight:700;margin-top:5px;color:#678065}
#timerMetric.warning{color:#c65c33}
#timerMetric.warning .metric-icon{color:#c65c33;animation:urgent 1s infinite}
.actions{display:flex;gap:9px;padding-top:7px;pointer-events:auto}
.icon-button{border:1px solid #ffffff85;width:47px;height:47px;border-radius:15px;background:var(--glass);color:var(--forest);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 17px #163f3020;transition:transform .2s,background .2s;backdrop-filter:blur(10px)}
.icon-button:hover{background:#e8ffa7;transform:translateY(-2px)}
.icon-button:active{transform:scale(.94)}
.icon-button svg{height:21px;width:21px}
#muteSlash{display:none}
.bottom{position:absolute;left:28px;right:28px;bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:22px}
.controls{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid #ffffff36;border-radius:17px;background:rgba(19,58,39,.55);backdrop-filter:blur(15px);color:#f6fce9;pointer-events:auto}
.lean-button{position:relative;display:grid;place-items:center;background:#f6fbe8ee;border:1px solid #ffffffa0;color:#244d36;width:42px;height:43px;border-radius:10px;cursor:pointer;transition:background .12s,transform .12s;touch-action:none}
.lean-button svg{width:21px;height:21px}
.lean-button.active,.lean-button:active{background:#d8f979;transform:scale(.94)}
.control-copy{padding:0 11px 0 5px;line-height:1.5}
.control-copy strong{font-size:11px;letter-spacing:1.6px;font-weight:600;display:block}
.control-copy span{font-size:10px;color:#d4e6c8}
.journey{position:absolute;width:min(34vw,410px);left:50%;transform:translateX(-50%);bottom:3px;color:#f8ffe9;text-shadow:0 1px 5px #103b3c55}
.journey-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:10px;font-weight:600;letter-spacing:1.6px}
.journey-name{display:flex;align-items:center;gap:7px}
.journey-name svg{width:14px;height:14px}
#distance{font-variant-numeric:tabular-nums;letter-spacing:.4px;color:#e4efd4;font-weight:500}
.track{position:relative;height:5px;border-radius:10px;background:#f4ffeb38}
#trackFill{position:absolute;left:0;top:0;height:100%;border-radius:10px;background:#d8f979;width:0}
#trackDot{position:absolute;width:11px;height:11px;border:2px solid #f4ffd5;background:#c2eb6c;border-radius:50%;top:-3px;left:0;transform:translateX(-50%);box-shadow:0 0 12px #ddff8b85}
.track-end{position:absolute;right:-2px;top:-2px;width:9px;height:9px;border:2px solid #eaffd7;border-radius:50%}
.score{text-align:right;color:#f8ffe9;text-shadow:0 2px 12px #13493180;min-width:150px}
.score-label{font-size:9px;font-weight:600;letter-spacing:2px;margin-bottom:1px}
.score-line{display:flex;align-items:center;justify-content:flex-end;gap:10px}
#scoreValue{font-family:Outfit,sans-serif;font-size:36px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
#combo{color:#254b30;background:#d8f979;padding:4px 7px;border-radius:6px;font-size:9px;font-weight:800;letter-spacing:.7px;text-shadow:none;opacity:0;transition:opacity .2s}
#ringHint{position:absolute;left:0;top:0;padding:5px 9px;background:rgba(24,68,41,.72);border:1px solid #e2fb9b70;backdrop-filter:blur(5px);border-radius:7px;color:#edffb1;font-size:10px;font-weight:700;letter-spacing:.8px;white-space:nowrap;will-change:transform;opacity:0}
#ringHint span{color:#f3f9e2a8;font-weight:500;margin-left:6px;letter-spacing:0}
#toast{position:absolute;left:50%;top:26%;transform:translate(-50%,10px);text-align:center;opacity:0;transition:opacity .2s,transform .25s;color:#f5ffcb;text-shadow:0 2px 18px #1b562c99;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast strong{font-family:Outfit,sans-serif;font-size:29px;letter-spacing:1.5px;font-weight:700;display:block}
#toast small{display:inline-block;font-size:11px;margin-top:5px;padding:5px 12px;background:#214b38b3;backdrop-filter:blur(8px);border-radius:20px;letter-spacing:.6px;color:#f5ffe2}
#toast.missed strong{font-size:22px;color:#ffe4b7}
#flash{position:fixed;inset:0;pointer-events:none}
#flash.hit{animation:hitFlash .5s ease-out}
#flash.miss{animation:missFlash .5s ease-out}
.end-screen{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:#123c342e;backdrop-filter:blur(4px);padding:20px}
.end-screen.visible{display:flex;animation:appear .4s}
.end-card{position:relative;width:min(430px,100%);padding:33px;text-align:center;background:#f6fbecef;border:1px solid #fff;border-radius:28px;box-shadow:0 25px 100px #143e3b50}
.end-emblem{width:67px;height:67px;margin:0 auto 20px;border-radius:23px;background:#d8f58d;display:grid;place-items:center;transform:rotate(-7deg)}
.end-emblem svg{width:37px;height:37px;transform:rotate(7deg)}
.end-kicker{font-size:10px;letter-spacing:2px;font-weight:700;color:#658059}
.end-card h2{font-family:Outfit,sans-serif;font-size:39px;letter-spacing:-1.5px;line-height:1.1;margin:10px 0 12px;font-weight:700}
.end-card p{font-size:13px;line-height:1.8;color:#69816b;margin:0 auto;max-width:320px}
.end-stats{display:grid;grid-template-columns:1fr 1fr 1fr;margin:25px 0;border:1px solid #dbe5ce;border-radius:15px;padding:16px 0}
.end-stat+.end-stat{border-left:1px solid #dbe5ce}
.end-stat b{display:block;font-family:Outfit,sans-serif;font-size:25px;font-weight:600;letter-spacing:-.5px}
.end-stat span{font-size:9px;font-weight:600;letter-spacing:1px;color:#718369}
.again{width:100%;border:0;border-radius:13px;background:#234f36;color:#f6ffdc;padding:16px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .2s}
.again:hover{background:#356e43;transform:translateY(-2px)}
.again svg{width:17px;height:17px}
#bestLine{margin-top:14px;font-size:10px;letter-spacing:.4px;color:#819075}
@keyframes hitFlash{0%{box-shadow:inset 0 0 100px #dfff8e66}100%{box-shadow:inset 0 0 0 #dfff8e00}}
@keyframes missFlash{0%{box-shadow:inset 0 0 65px #efbd7238}100%{box-shadow:inset 0 0 0 #efbd7200}}
@keyframes urgent{50%{opacity:.4}}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1050px){
.brand{padding-right:14px}.brand h1{font-size:22px}.brand .eyebrow{font-size:8px}
.metric{padding:0 15px;min-width:135px}.metric-value{font-size:26px}
.control-copy{padding-right:4px}.journey{width:31vw}
}
@media(max-width:700px){
.topbar{top:15px;left:14px;right:14px;gap:8px}
.brand{gap:8px;background:transparent;box-shadow:none;border:0;backdrop-filter:none;padding:3px 0;color:#16432f}
.brand-icon{width:34px;height:34px;border-radius:11px;box-shadow:0 3px 14px #2a572f15}
.brand-icon svg{width:23px;height:23px}.brand h1{font-size:19px;max-width:90px;line-height:.98;letter-spacing:-.5px}.brand .eyebrow{display:none}
.metrics{top:61px;padding:10px 1px;border-radius:16px}
.metric{min-width:127px;gap:8px;padding:0 13px}
.metric-value{font-size:25px}.metric-label{font-size:8px;margin-top:4px}
.metric-icon{width:27px}.metric-icon svg{width:25px;height:25px}
.actions{padding-top:0;gap:7px}.icon-button{width:38px;height:38px;border-radius:12px}.icon-button svg{width:18px;height:18px}
.bottom{bottom:23px;left:16px;right:16px;display:block}
.controls{background:none;backdrop-filter:none;border:0;padding:0;display:contents}
.lean-button{position:absolute;bottom:0;width:59px;height:58px;border-radius:17px;background:#f8ffe8d9;box-shadow:0 4px 20px #123b3a26}
.lean-button svg{width:26px;height:26px}
#leftButton{left:0}#rightButton{right:0}
.control-copy{position:absolute;text-align:center;left:50%;transform:translateX(-50%);bottom:0;padding:0;white-space:nowrap}
.control-copy strong{font-size:9px;letter-spacing:2px;color:#f0ffdc}.control-copy span{font-size:9px}
.journey{width:calc(100vw - 52px);bottom:88px}
.journey-label{font-size:9px;margin-bottom:9px}
.score{position:fixed;right:17px;top:145px;min-width:0}
.score-label{font-size:8px}#scoreValue{font-size:28px}
.score-line{gap:6px}#combo{font-size:8px;padding:3px 5px}
#toast{top:28%}#toast strong{font-size:25px}
.end-card{padding:27px}.end-card h2{font-size:34px}
}
@media(max-height:500px) and (min-width:701px){
.topbar{top:12px;left:18px;right:18px}.brand{padding:8px 13px 8px 8px}.brand-icon{height:35px;width:35px}.brand h1{font-size:21px}
.metrics{padding:8px 2px}.metric-value{font-size:24px}.bottom{bottom:15px;left:18px;right:18px}
#toast{top:24%}.end-card{padding:19px;width:390px}.end-emblem{display:none}.end-stats{margin:15px 0}.end-card h2{font-size:30px}
}
</style>
</head>
<body>
<div id="world" aria-label="A zipline through the rainforest. Lean with A and D, arrow keys, or by dragging."></div>
<div class="vignette"></div>
<div class="hud">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" fill="none"><path d="M25 5C12 3 5 9 7 19c2 7 13 8 17 0 2-4 2-9 1-14Z" fill="#315b32"/><path d="M6 27 21 11M12 20l-1-7m6 2 6 1" stroke="#e2f9a1" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div><div class="eyebrow">A LITTLE WILD, A LOT OF WONDER</div><h1>Canopy Rush</h1></div>
    </div>
    <div class="metrics">
      <div class="metric" id="timerMetric">
        <div class="metric-icon"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="18" r="10.5" stroke="currentColor" stroke-width="1.9"/><path d="M16 12v6l4 2M13 3h6m-3 0v4m9 2 2 2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></div>
        <div><div class="metric-value" id="timeValue">00:48</div><div class="metric-label">TIME LEFT</div></div>
      </div>
      <div class="metric">
        <div class="metric-icon"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="11" stroke="#a3bb65" stroke-width="1.5" stroke-dasharray="2 4"/><path d="M22 8c-10-1-15 5-11 12 6 5 14-1 11-12Z" fill="#6e9d43"/><path d="m9 25 10-13" stroke="#385a34" stroke-width="1.5" stroke-linecap="round"/></svg></div>
        <div><div class="metric-value"><span id="ringsValue">0</span><span class="total">/ 18</span></div><div class="metric-label">LEAF RINGS</div></div>
      </div>
    </div>
    <div class="actions">
      <button class="icon-button" id="soundButton" title="Mute sound" aria-label="Mute sound" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M11 5 6 9H3v6h3l5 4V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><g id="soundWaves"><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></g><path id="muteSlash" d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-button" id="resetButton" title="Reset ride (R)" aria-label="Reset ride">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 10a8 8 0 1 1 .5 6M4 4v6h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <div id="ringHint">01 <span>24 m</span></div>
  <div id="toast" role="status"><strong id="toastTitle"></strong><small id="toastDetail"></small></div>
  <div class="bottom">
    <div class="controls">
      <button class="lean-button" id="leftButton" aria-label="Lean left"><svg viewBox="0 0 24 24" fill="none"><path d="m13 5-7 7 7 7M6 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="lean-button" id="rightButton" aria-label="Lean right"><svg viewBox="0 0 24 24" fill="none"><path d="m11 5 7 7-7 7m7-7H4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="control-copy"><strong>LEAN INTO IT</strong><span>A / D &nbsp;·&nbsp; arrows &nbsp;·&nbsp; drag</span></div>
    </div>
    <div class="journey">
      <div class="journey-label"><span class="journey-name"><svg viewBox="0 0 20 20" fill="none"><path d="M4 17V3m0 1c4-4 8 4 12 0v8c-4 4-8-4-12 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>LANDING PLATFORM</span><span id="distance">696 m</span></div>
      <div class="track"><div id="trackFill"></div><div class="track-end"></div><div id="trackDot"></div></div>
    </div>
    <div class="score"><div class="score-label">CANOPY POINTS</div><div class="score-line"><span id="combo">FLOW ×2</span><span id="scoreValue">0</span></div></div>
  </div>
</div>
<div id="flash"></div>
<div class="end-screen" id="endScreen">
  <section class="end-card" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <div class="end-emblem"><svg viewBox="0 0 40 40" fill="none"><path d="M30 6C14 4 6 12 10 25c5 8 19 5 21-6 1-4 0-9-1-13Z" fill="#416738"/><path d="m8 34 18-21m-11 13-1-9m6 4 8 0" stroke="#e5f9ad" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div class="end-kicker" id="endKicker">CANOPY RUN COMPLETE</div>
    <h2 id="endTitle">Hello, treetops!</h2>
    <p id="endDescription"></p>
    <div class="end-stats">
      <div class="end-stat"><b id="endScore">0</b><span>POINTS</span></div>
      <div class="end-stat"><b id="endRings">0 / 18</b><span>LEAF RINGS</span></div>
      <div class="end-stat"><b id="endFlow">0</b><span>BEST FLOW</span></div>
    </div>
    <button class="again" id="againButton"><svg viewBox="0 0 24 24" fill="none"><path d="M4 10a8 8 0 1 1 .5 6M4 4v6h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Another little adventure</button>
    <div id="bestLine">YOUR BEST · 0 POINTS</div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TOTAL = 18, END = 696, MAX_LEAN = 4.05;
let state = 'start', progress = 0, lean = 0, speed = 15.4, timeLeft = 48;
let collected = 0, score = 0, combo = 0, bestCombo = 0, nextRing = 0;
let clock = 0, lastTime = 0, missSlow = 0, endElapsed = 0, toastTimeout;
let bestScore = 0;
try { bestScore = Number(localStorage.getItem('canopy-rush-best')) || 0; } catch(e) {}
const keys = {left:false, right:false};
const held = {left:false, right:false};
let dragging = false, dragLean = 0;
let width = innerWidth, height = innerHeight;
const mobile = () => width < 700;

let seed = 43127;
function random(){ seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const range = (a,b) => a + random() * (b-a);
const choose = a => a[Math.floor(random()*a.length)];
const clamp = THREE.MathUtils.clamp;
const v3 = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
function rail(s) {
  return v3(2.8*Math.sin(s*.015)+1.7*Math.sin(s*.032), 29-s*.013-2*Math.sin(Math.PI*s/END), -s);
}
function groundY(x,s) {
  const center = rail(s).x;
  return -2.4 + Math.max(0,Math.abs(x-center)-10)*.105 + Math.sin(x*.075+s*.044)*1.3 + Math.cos(s*.067)*.75;
}
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb8e3cd, 52, 210);
const camera = new THREE.PerspectiveCamera(mobile()?65:56,width/height,.12,280);
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setSize(width,height);
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile()?1.6:1.8));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('world').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd7fff1,0x416d35,2.05));
const sun = new THREE.DirectionalLight(0xfff3c4,3.1);
sun.position.set(-36, seventy(),20);
function seventy(){return  seventy.value ||  seventy.value === 0 ? seventy.value :  seventy.value= seventy.num ||  seventy.num === 0 ? seventy.num :  seventy.num= seventy.base || 72;}
sun.castShadow = true;
sun.shadow.mapSize.set(1536,1536);
Object.assign(sun.shadow.camera,{left:-48,right:48,top:48,bottom:-48,near:1,far:145});
sun.shadow.bias = -.0005;
sun.shadow.normalBias = .14;
scene.add(sun,sun.target);
const fillLight = new THREE.DirectionalLight(0x9edee7,.55);
fillLight.position.set(30,28,30);scene.add(fillLight);
const windUniform = {value:0};

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(230,24,16),
  new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,
    uniforms:{},
    vertexShader:'varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'varying vec3 vP; void main(){float h=smoothstep(-25.0,160.0,vP.y);vec3 col=mix(vec3(.75,.90,.75),vec3(.32,.73,.78),h);gl_FragColor=vec4(col,1.0);}'
  })
);
sky.renderOrder=-100;scene.add(sky);

function standard(color,extra={}) {
  return new THREE.MeshStandardMaterial({color,roughness:.9,...extra});
}
function makeMesh(geo,mat,x=0,y=0,z=0,sx=1,sy=1,sz=1,parent=scene){
  const m = new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m;
}
const unitBox = new THREE.BoxGeometry(1,1,1);
const unitSphere = new THREE.SphereGeometry(1,14,10);
const organicGeo = new THREE.IcosahedronGeometry(1,1);
const rockGeo = new THREE.DodecahedronGeometry(1,0);
const unitCylinder = new THREE.CylinderGeometry(1,1,1,8);
const cylinderY = v3(0,1,0);
function segment(a,b,r,mat,parent=scene) {
  const m = new THREE.Mesh(unitCylinder,mat);
  const direction=b.clone().sub(a);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(cylinderY,direction.clone().normalize());
  m.scale.set(r,direction.length(),r);
  parent.add(m);return m;

makeMesh(unitBox,strapMat,0,.91,.265,.35,.08,.03,body);
for(const side of [-1,1]){

  makeMesh(unitBox,strapMat,side*.24,.27,-.239,.075,.82,.028,body);
}
makeMesh(unitBox,strapMat,0,-.16,0,.81,.12,.49,body);
makeMesh(unitBox,packMat,0,.24,.34,.63,.78,.29,body);
makeMesh(unitSphere,packMat,0,.58,.35,.315,.16,.145,body);
makeMesh(unitBox,packTrim,0,.01,.505,.44,.27,.055,body);
makeMesh(unitBox,strapMat,0,.39,.5,.07,.38,.035,body);
makeMesh(unitBox,helmetMat,0,.22,.526,.12,.09,.025,body);
const legs=[];
for(const side of [-1,1]){
  const leg=new THREE.Group();leg.position.set(side*.22,-.41,0);body.add(leg);
  makeMesh(unitCylinder,shortsMat,0,-.15,0,.15,.33,.15,leg);

rider.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
rider.scale.setScalar(1.12);
const trolley=new THREE.Group();scene.add(trolley);
const metalMat=standard(0x566554,{metalness:.7,roughness:.4});
makeMesh(unitBox,helmetMat,0,-.08,0,.34,.18,.68,trolley);
for(const z of [-.21,.21]){
  const wheel=makeMesh(new THREE.CylinderGeometry(.15,.15,.18,12),metalMat,0,.11,z,1,1,1,trolley);wheel.rotation.z=Math.PI/2;

const ropeMat=standard(0xd4c97b,{roughness:1});
const ropes=[
  segment(v3(),v3(0,1,0),.028,ropeMat),
  segment(v3(),v3(0,1,0),.028,ropeMat)

const airLeaves=[];

for(let i=0;i<35;i++){
  const m=makeMesh(smallLeafGeo,airborneMat,0,0,0,range(.15,.4),range(.23,.55),1);
  airLeaves.push({m,offset:range(0,115),x:range(-13,13),y:range(-5,8),phase:range(0,7),spin:range(.5,1.6)});

const butterflies=[];
for(let i=0;i<8;i++){
  const g=new THREE.Group(),wings=[];
  const mat=standard(choose([0x4dbbeb,0xfcbd49,0xf27d61,0x91baf5]),{side:THREE.DoubleSide,emissive:0x172622,emissiveIntensity:.2});

const pollenCount=300,pollenPositions=new Float32Array(pollenCount*3),pollenSeeds=[];
for(let i=0;i<pollenCount;i++)pollenSeeds.push([range(-25,25),range(-12,13),range(0,150),range(0,7)]);
const pollenGeo=new THREE.BufferGeometry();pollenGeo.setAttribute('position',new THREE.BufferAttribute(pollenPositions,3));
const pollen=new THREE.Points(pollenGeo,new THREE.PointsMaterial({map:softTexture,color:0xfff4c2,size:.12,transparent:true,opacity:.65,depthWrite:false}));
pollen.frustumCulled=false;scene.add(pollen);

const sparks=[],MAX_SPARKS=700;
const sparkPositions=new Float32Array(MAX_SPARKS*3),sparkColors=new Float32Array(MAX_SPARKS*3);
const sparkGeo=new THREE.BufferGeometry();sparkGeo.setAttribute('position',new THREE.BufferAttribute(sparkPositions,3));sparkGeo.setAttribute('color',new THREE.BufferAttribute(sparkColors,3));sparkGeo.setDrawRange(0,0);
const sparkMesh=new THREE.Points(sparkGeo,new THREE.PointsMaterial({map:softTexture,vertexColors:true,size:.24,transparent:true,opacity:.94,depthWrite:false,blending:THREE.AdditiveBlending}));
sparkMesh.frustumCulled=false;scene.add(sparkMesh);
function burst(position,n=45){
  for(let i=0;i<n&&sparks.length<MAX_SPARKS;i++){
    const a=random()*Math.PI*2;
    const c=new THREE.Color(choose([0xf4ff9b,0xc9ed57,0x9cdd73,0xffe09c]));
    sparks.push({p:position.clone().add(v3(Math.cos(a)*1.65,Math.sin(a)*1.65,range(-.15,.15))),v:v3(Math.cos(a)*range(1,4),Math.sin(a)*range(1,4),range(-1,4)),life:1,decay:range(.75,1.3),c});
  }
}

let audioCtx,master,windGain, soundEnabled=true, nextBird=4;
function initAudio(){
  if(!soundEnabled)return;
  try{
    if(!audioCtx){
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      master=audioCtx.createGain();master.gain.value=.3;master.connect(audioCtx.destination);
      const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
      const data=buffer.getChannelData(0);let previous=0;
      for(let i=0;i<data.length;i++){previous=(previous+(Math.random()*2-1)*.03)/1.02;data[i]=previous*3.5;}
      const noise=audioCtx.createBufferSource();noise.buffer=buffer;noise.loop=true;
      const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1100;
      windGain=audioCtx.createGain();windGain.gain.value=.1;
      noise.connect(filter);filter.connect(windGain);windGain.connect(master);noise.start();
    }
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
function tone(freq,start,duration,volume=.16,type='sine',endFreq){
  if(!audioCtx||!soundEnabled||audioCtx.state!=='running')return;
  const t=audioCtx.currentTime+start,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+duration);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+duration);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+duration+.02);
}
function ringSound(perfect){
  const shift=1+Math.min(combo,8)*.025;
  [784,988,1175].forEach((n,i)=>tone(n*shift,i*.065,.32,perfect?.2:.15,'sine'));
  if(perfect)tone(1568*shift,.19,.36,.12);
}
function showToast(title,detail,miss=false){
  clearTimeout(toastTimeout);
  $('toastTitle').textContent=title;$('toastDetail').textContent=detail;
  $('toast').className=miss?'show missed':'show';
  toastTimeout=setTimeout(()=>$('toast').className='',1150);
}
function flash(kind){
  $('flash').className='';void $('flash').offsetWidth;$('flash').className=kind;
}
function timeText(n){
  n=Math.max(0,Math.ceil(n));
  return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
}
function updateHUD(){
  $('timeValue').textContent=timeText(timeLeft);
  $('timerMetric').classList.toggle('warning',timeLeft<10);
  $('ringsValue').textContent=collected;
  $('scoreValue').textContent=score.toLocaleString();
  $('combo').style.opacity=combo>=2?'1':'0';$('combo').textContent='FLOW ×'+combo;
  const percent=Math.min(100,progress/END*100)+'%';
  $('trackFill').style.width=percent;$('trackDot').style.left=percent;
  $('distance').textContent=Math.max(0,Math.ceil(END-progress))+' m';
}
function passRing(r){
  r.passed=true;r.age=0;
  const error=Math.abs(lean-r.offset);
  if(error<1.8){
    r.hit=true;collected++;combo++;bestCombo=Math.max(bestCombo,combo);
    const perfect=error<.72;
    const points=100+Math.min(combo-1,8)*25+(perfect?50:0);
    score+=points;timeLeft+=1.2;
    burst(r.group.position);
    showToast(perfect?'PERFECT LEAN!':combo>=3?'IN THE FLOW!':'LEAF CAUGHT!','+'+points+' points  ·  +1.2 seconds');
    flash('hit');ringSound(perfect);
  }else{
    combo=0;timeLeft=Math.max(0,timeLeft-1.5);missSlow=1.6;
    r.coreMat.color.set(0xffb879);
    showToast('A little more lean','Ring missed  ·  −1.5 seconds',true);
    flash('miss');tone(240,0,.17,.12,'sine',170);
  }
  nextRing++;
}
function finish(won){
  if(state!=='playing')return;
  state=won?'complete':'gameover';endElapsed=0;
  keys.left=keys.right=held.left=held.right=false;dragging=false;
  clearTimeout(toastTimeout);$('toast').className='';
  $('ringHint').style.opacity=0;
  if(won){
    score+=Math.ceil(timeLeft)*10;
    burst(rider.position,90);
    [523,659,784,1047].forEach((n,i)=>tone(n,i*.13,.6,.2));
  }else{
    tone(392,0,.35,.15);tone(330,.18,.5,.13);
  }
  const newBest=score>bestScore;
  bestScore=Math.max(bestScore,score);
  try{localStorage.setItem('canopy-rush-best',String(bestScore));}catch(e){}
  $('endKicker').textContent=won?'CANOPY RUN COMPLETE':'THE BREEZE GOT AWAY';
  $('endTitle').textContent=won?'Hello, treetops!':'One more ride?';
  $('endDescription').textContent=won?
    `You caught ${collected} leaf rings and landed with ${Math.ceil(timeLeft)} seconds to spare. A breath of fresh adventure.`:
    `Time flew! You found ${collected} of ${TOTAL} leaf rings. Catch more leaves to add time and keep your flow.`;
  $('endScore').textContent=score.toLocaleString();
  $('endRings').textContent=collected+' / '+TOTAL;
  $('endFlow').textContent='×'+bestCombo;
  $('bestLine').textContent=(newBest?'NEW PERSONAL BEST':'YOUR BEST')+' · '+bestScore.toLocaleString()+' POINTS';
  updateHUD();
  setTimeout(()=>{
    if(state==='complete'||state==='gameover'){
      $('endScreen').classList.add('visible');$('againButton').focus({preventScroll:true});
    }
  },won?1000:450);
}
const cameraLook=v3(),targetCamera=v3(),targetLook=v3();
function setCamera(snap=false,dt=.016){
  const p=rail(progress),back=mobile()?17:12;
  const behind=rail(progress-back);
  targetCamera.set(behind.x+lean*.15,behind.y+(mobile()?1.8:.8),behind.z);
  const ahead=rail(Math.min(END+8,progress+19));
  targetLook.set(ahead.x+lean*.1,ahead.y-3.3,ahead.z);
  if(state==='complete'){
    targetCamera.x+=Math.min(endElapsed,3)*1.1;
    targetCamera.y+=Math.min(endElapsed,3)*.45;
    targetLook.copy(p).add(v3(0,-2.3,-5));
  }
  if(snap){camera.position.copy(targetCamera);cameraLook.copy(targetLook);}
  else{camera.position.lerp(targetCamera,1-Math.exp(-dt*5));cameraLook.lerp(targetLook,1-Math.exp(-dt*5));}
  camera.lookAt(cameraLook);
}
function reset(){
  state='playing';progress=0;lean=0;speed=15.4;timeLeft=48;
  collected=score=combo=bestCombo=nextRing=0;missSlow=endElapsed=0;
  keys.left=keys.right=held.left=held.right=false;dragging=false;dragLean=0;
  sparks.length=0;clearTimeout(toastTimeout);$('toast').className='';$('flash').className='';
  $('endScreen').classList.remove('visible');
  $('leftButton').classList.remove('active');$('rightButton').classList.remove('active');
  rings.forEach(r=>{r.passed=false;r.hit=false;r.age=0;r.group.scale.setScalar(1);r.coreMat.color.set(0xe5ff81);r.group.visible=true;});
  setCamera(true);updateHUD();
  lastTime=performance.now();
}
$('resetButton').addEventListener('click',()=>{initAudio();reset();$('resetButton').blur();});
$('againButton').addEventListener('click',()=>{initAudio();reset();$('againButton').blur();});
$('soundButton').addEventListener('click',()=>{
  soundEnabled=!soundEnabled;
  if(soundEnabled)initAudio();
  if(master)master.gain.setTargetAtTime(soundEnabled?.3:0,audioCtx.currentTime,.08);
  $('soundWaves').style.display=soundEnabled?'':'none';$('muteSlash').style.display=soundEnabled?'none':'block';
  $('soundButton').title=soundEnabled?'Mute sound':'Enable sound';
  $('soundButton').setAttribute('aria-label',soundEnabled?'Mute sound':'Enable sound');
  $('soundButton').setAttribute('aria-pressed',String(soundEnabled));
});
function bindLeanButton(id,direction){
  const b=$(id);
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();initAudio();
    b.setPointerCapture(e.pointerId);held[direction]=true;
  });
  const release=()=>held[direction]=false;
  b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release);
}
bindLeanButton('leftButton','left');bindLeanButton('rightButton','right');
const canvas=renderer.domElement;
function steer(e){dragLean=clamp((e.clientX/width-.5)*MAX_LEAN*2.65,-MAX_LEAN,MAX_LEAN);}
canvas.addEventListener('pointerdown',e=>{
  if(state!=='playing')return;
  initAudio();dragging=true;steer(e);canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{if(dragging)steer(e);});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);
canvas.addEventListener('lostpointercapture',()=>dragging=false);
window.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if(['arrowleft','arrowright','a','d','r'].includes(key)){
    e.preventDefault();initAudio();
    if(key==='arrowleft'||key==='a')keys.left=true;
    if(key==='arrowright'||key==='d')keys.right=true;
    if(key==='r'&&!e.repeat)reset();
  }
  if(key==='enter'&&(state==='gameover'||state==='complete')){e.preventDefault();reset();}
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;
});
window.addEventListener('blur',()=>{keys.left=keys.right=held.left=held.right=false;dragging=false;});
document.addEventListener('visibilitychange',()=>{
  lastTime=performance.now();
  if(audioCtx&&master)master.gain.setTargetAtTime(document.hidden?0:(soundEnabled?.3:0),audioCtx.currentTime,.1);
});
window.addEventListener('resize',()=>{
  width=innerWidth;height=innerHeight;
  camera.aspect=width/height;camera.fov=mobile()?65:56;camera.updateProjectionMatrix();
  renderer.setSize(width,height);renderer.setPixelRatio(Math.min(devicePixelRatio,mobile()?1.6:1.8));
  setCamera(true);
});
const projected=v3();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.04,Math.max(0,(now-lastTime)/1000));lastTime=now;
  if(document.hidden)return;
  clock+=dt;windUniform.value=clock;
  if(state==='playing'){
    const left=keys.left||held.left,right=keys.right||held.right;
    const target=dragging?dragLean:((right?1:0)-(left?1:0))*MAX_LEAN;
    lean+=(target-lean)*(1-Math.exp(-dt*8));
    $('leftButton').classList.toggle('active',left||(dragging&&dragLean<-.5));
    $('rightButton').classList.toggle('active',right||(dragging&&dragLean>.5));
    missSlow=Math.max(0,missSlow-dt);
    const targetSpeed=missSlow>0?13.6:15.4+Math.min(combo,5)*.23;
    speed+=(targetSpeed-speed)*(1-Math.exp(-dt*2.4));
    progress=Math.min(END,progress+speed*dt);timeLeft=Math.max(0,timeLeft-dt);
    while(nextRing<TOTAL&&progress>=rings[nextRing].s)passRing(rings[nextRing]);
    if(timeLeft<=0)finish(false);else if(progress>=END)finish(true);
    updateHUD();
  }else{
    endElapsed+=dt;
    if(state==='complete')lean*=Math.exp(-dt*2);
  }

  const p=rail(progress),ahead=rail(progress+1);
  rider.position.set(p.x+lean,p.y-3.2+Math.abs(lean)*.035,-progress);
  rider.rotation.y=-Math.atan2(ahead.x-p.x,1);
  body.rotation.z=-lean*.105+Math.sin(clock*2.5)*.016;
  body.rotation.x=.055+Math.sin(clock*2)*.017;
  legs.forEach((leg,i)=>leg.rotation.x=(state==='complete'?0:.14)+Math.sin(clock*3.5+i*1.4)*.09);
  trolley.position.copy(p);
  trolley.rotation.y=rider.rotation.y;
  rider.updateMatrixWorld(true);
  const handA=body.localToWorld(v3(-.34,1.54,-.09));
  const handB=body.localToWorld(v3(.34,1.54,-.09));
  updateSegment(ropes[0],p.clone().add(v3(-.12,-.17,0)),handA,.027);
  updateSegment(ropes[1],p.clone().add(v3(.12,-.17,0)),handB,.027);
  setCamera(false,dt);

  sky.position.copy(camera.position);
  sunGlow.position.set(camera.position.x-59,76,camera.position.z-173);
  sun.position.set(p.x-38,p.y+48,p.z+24);
  sun.target.position.set(p.x,8,p.z-31);
  for(let i=0;i<rings.length;i++){
    const r=rings[i],distance=r.s-progress;
    if(r.passed)r.age+=dt;
    r.group.visible=distance<165&&distance>-10&&(!r.hit||r.age<.38);
    if(r.hit)r.group.scale.setScalar(1+r.age*2.6);
    else{
      r.group.scale.setScalar(1+Math.sin(clock*2.1+i)*.017);
      r.group.rotation.z=Math.sin(clock*.5+i)*.035;
    }
    r.glow.material.opacity=i===nextRing?.55+Math.sin(clock*3)*.13:.28;
  }
  if(nextRing<TOTAL&&state==='playing'){
    const r=rings[nextRing],distance=r.s-progress;
    nextLight.position.copy(r.group.position);nextLight.intensity=7;
    projected.copy(r.group.position).add(v3(0,2.85,0)).project(camera);
    if(projected.z<1&&projected.x>-.92&&projected.x<.92&&projected.y>-.7&&projected.y<.65&&distance>5){
      $('ringHint').style.opacity='1';
      $('ringHint').style.transform=`translate(${(projected.x*.5+.5)*width}px,${(-projected.y*.5+.5)*height}px) translate(-50%,-100%)`;
      $('ringHint').innerHTML=String(nextRing+1).padStart(2,'0')+' <span>'+Math.ceil(distance)+' m</span>';
    }else $('ringHint').style.opacity='0';
  }else{nextLight.intensity=0;$('ringHint').style.opacity='0';}

  airLeaves.forEach(l=>{
    const s=progress+((l.offset+clock*1.9)%115)-9,base=rail(s);
    l.m.position.set(base.x+l.x+Math.sin(clock*.7+l.phase),base.y+l.y+Math.sin(clock+l.phase)*.8,-s);
    l.m.rotation.set(clock*.3+l.phase,clock*l.spin,Math.sin(clock*.6+l.phase)*.8);
  });
  butterflies.forEach(b=>{
    const s=progress+b.s+Math.sin(clock*.6+b.phase)*4,base=rail(s);
    b.g.position.set(base.x+b.x+Math.sin(clock*1.1+b.phase)*1.7,base.y+b.y+Math.sin(clock*1.5+b.phase)*.5,-s);
    b.g.rotation.y=Math.sin(clock*.7+b.phase);
    b.wings[0].rotation.y=Math.sin(clock*17+b.phase)*.8;
    b.wings[1].rotation.y=-Math.sin(clock*17+b.phase)*.8;
  });
  for(let i=0;i<pollenCount;i++){
    const a=pollenSeeds[i],s=progress+((a[2]+clock*.7)%150)-15,base=rail(s);
    pollenPositions[i*3]=base.x+a[0]+Math.sin(clock*.3+a[3]);
    pollenPositions[i*3+1]=base.y+a[1]+Math.sin(clock*.4+a[3])*.6;
    pollenPositions[i*3+2]=-s;
  }
  pollenGeo.attributes.position.needsUpdate=true;
  mists.forEach(m=>{
    m.mesh.position.x=m.base.x+Math.sin(clock*.19+m.phase)*1.7;
    m.mesh.position.y=m.base.y+Math.sin(clock*.26+m.phase)*.35;
  });
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.life-=dt*s.decay;
    if(s.life<=0){sparks.splice(i,1);continue;}
    s.v.y-=dt*1.8;s.p.addScaledVector(s.v,dt);
  }
  for(let i=0;i<sparks.length;i++){
    const s=sparks[i];sparkPositions[i*3]=s.p.x;sparkPositions[i*3+1]=s.p.y;sparkPositions[i*3+2]=s.p.z;
    sparkColors[i*3]=s.c.r*s.life;sparkColors[i*3+1]=s.c.g*s.life;sparkColors[i*3+2]=s.c.b*s.life;
  }
  sparkGeo.attributes.position.needsUpdate=true;sparkGeo.attributes.color.needsUpdate=true;sparkGeo.setDrawRange(0,sparks.length);
  if(clock>nextBird){
    nextBird=clock+range(5,10);
    if(soundEnabled&&state==='playing'){
      const f=range(1600,2400);tone(f,0,.12,.055,'sine',f*1.35);tone(f*1.1,.15,.15,.045,'sine',f*.9);
    }
  }
  renderer.render(scene,camera);
}
reset();
requestAnimationFrame(animate);
})();
</script>
